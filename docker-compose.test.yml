services:
  app:
    build:
      context: .
      dockerfile: docker/php83/Dockerfile
    working_dir: /var/www/html
    command: sh -lc "php artisan serve --host=0.0.0.0 --port=8000"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    ports:
      - "${TEST_HTTP_PORT:-46001}:8000"
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php83/Dockerfile
    working_dir: /var/www/html
    command: sh -lc "php artisan queue:work redis --queue=pushes,default --sleep=1 --tries=3 --timeout=120 --memory=512"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php83/Dockerfile
    working_dir: /var/www/html
    command: sh -lc "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-adminapi_test}"
      MYSQL_USER: "${DB_USERNAME:-adminapi}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-adminapi}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-46306}:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-46379}:6379"
    volumes:
      - redis_test_data:/data
    restart: unless-stopped

volumes:
  mysql_test_data:
  redis_test_data:
